<!DOCTYPE html>

  <div class="topbar">

        <span class="brand-mark">U</span>

      </a>
      <div class="topbar-actions">
        <button class="theme-toggle" data-theme-toggle type="button" aria-pressed="false">Dark mode</button>

        <a class="avatar" href="profile.html">JD</a>

    </div>
  </div>
  <main class="layout-rail">

    </div>

          <span class="material-symbols-outlined">info</span>
          <h4 data-page-notice-title>About this profile</h4>
        </div>
        <p data-page-notice-body>This page lists one student’s posts and bio.</p>
