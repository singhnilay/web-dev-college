<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — The Common Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=DM+Serif+Display&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    rel="stylesheet" />
  <link href="../css/style.css" rel="stylesheet" />
  <link href="../css/signup.css" rel="stylesheet" />
  <script src="../js/theme.js"></script>
</head>

<body>
  <div class="split">
    <div class="brand-panel">
      <div class="brand-copy">
        <h2>Join the Discourse</h2>
        <p>Gain access to campus conversations, academic debates, and the rooms where students actually talk.</p>
      </div>
    </div>
    <div class="form-panel">
      <div class="signup-header">
        <a class="back-row signup-back" href="../index.html">
          <span class="material-symbols-outlined">arrow_back</span>
          Back
        </a>
        <button class="theme-toggle" data-theme-toggle type="button" aria-pressed="false">Dark mode</button>
      </div>
      <div class="form-wrap">
        <div class="form-intro">
          <h1>Create Account</h1>
          <p>For students, faculty, and alumni.</p>
        </div>
        <form id="signup-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input class="editorial-input" id="email" name="email" placeholder="Enter your .edu email"
              type="email" aria-describedby="email-error" />
            <p class="field-error is-hidden" id="email-error"></p>
          </div>
          <div class="field">
            <label for="username">Username</label>
            <input class="editorial-input" id="username" name="username" placeholder="Choose a username"
              type="text" aria-describedby="username-error" />
            <p class="field-error is-hidden" id="username-error"></p>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="editorial-input" id="password" name="password" placeholder="Create a password"
              type="password" aria-describedby="password-error" />
            <p class="field-error is-hidden" id="password-error"></p>
          </div>
          <button class="btn-primary" type="submit">Create Account</button>
          <p class="login-footer plain">
            Already have an account? <a href="login.html">Sign in</a>
          </p>
        </form>
      </div>
    </div>
  </div>
  <script src="../js/signup.js"></script>
</body>

</html>
