<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New post — The Common Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=DM+Serif+Display&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    rel="stylesheet" />
  <link href="../css/style.css" rel="stylesheet" />
  <link href="../css/create-post.css" rel="stylesheet" />
  <script src="../js/theme.js"></script>
</head>

<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="feed.html">
        <span class="brand-mark">C</span>
        <h2 class="brand-name">The Common Room</h2>
      </a>
      <div class="topbar-actions">
        <button class="theme-toggle" data-theme-toggle type="button" aria-pressed="false">Dark mode</button>
        <a class="avatar" href="profile.html">JD</a>
      </div>
    </div>
  </div>
  <main class="page-narrow">
    <a class="back-row" href="feed.html">
      <span class="material-symbols-outlined">arrow_back</span>
      Feed
    </a>
    <h1>Create a post</h1>
    <p class="lede">Title, body, and a community. Image upload comes later.</p>
    <form class="create-form" id="create-form">
      <div class="field">
        <label for="title">Title</label>
        <input class="editorial-input" id="title" name="title" placeholder="What's on your mind?" required type="text" />
      </div>
      <div class="field">
        <label for="community">Community</label>
        <select class="editorial-select" id="community" name="community" required>
          <option value="">Choose a room</option>
          <option value="Campus Life">Campus Life</option>
          <option value="Academics">Academics</option>
          <option value="Events">Events</option>
          <option value="Memes">Memes</option>
          <option value="Opportunities">Opportunities</option>
          <option value="Questions">Questions</option>
        </select>
      </div>
      <div class="field">
        <label for="content">Content</label>
        <textarea class="editorial-textarea" id="content" name="content" placeholder="Write the rest here."
          required></textarea>
      </div>
      <label class="check-row">
        <input type="checkbox" id="anonymous" name="anonymous" />
        Post as Anonymous Student
      </label>
      <p class="field-error is-hidden" id="form-error"></p>
      <button class="btn-primary" type="submit">Publish</button>
    </form>
  </main>
  <script src="../js/app.js"></script>
  <script src="../js/create-post.js"></script>
</body>

</html>
