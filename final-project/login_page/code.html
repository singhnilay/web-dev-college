<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>UniHub - Welcome Back</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&amp;family=DM+Serif+Display&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
</head>

<body>
    <header class="site-header">
        <a class="back-link" href="#">
            <span class="material-symbols-outlined">arrow_back</span>
            Return
        </a>
        <div class="wordmark">UniHub</div>
    </header>
    <main class="login-main">
        <div class="login-card">
            <div class="error-banner is-hidden" id="error-banner">
                Invalid credentials. Please verify your email and password.
            </div>
            <div class="login-intro">
                <h1>Welcome Back</h1>
                <p>Continue the discourse.</p>
            </div>
            <form action="#" class="login-form" method="POST">
                <div class="field">
                    <label for="email">University Email</label>
                    <input class="editorial-input" id="email" name="email" placeholder="scholar@university.edu"
                        required="" type="email" />
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input class="editorial-input" id="password" name="password" placeholder="Enter your password"
                        required="" type="password" />
                </div>
                <div class="form-row">
                    <a href="#">Forgot Password?</a>
                </div>
                <button class="btn-submit" type="submit">
                    <span>Sign In</span>
                    <span class="material-symbols-outlined">arrow_forward</span>
                </button>
            </form>
            <div class="login-footer">
                <p>
                    New to the Register? <a href="#">Request access</a>
                </p>
            </div>
        </div>
    </main>
</body>

</html>
